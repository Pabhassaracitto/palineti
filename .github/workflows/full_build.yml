name: Flutter Full Build - Android, iOS, Windows, Linux, Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android?'
        type: boolean
        default: false
      build_ios:
        description: 'Build iOS?'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows?'
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux?'
        type: boolean
        default: false
      build_web:
        description: 'Build Web?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.build_android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data assets/branding

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (ARM64 only)
        run: |
          flutter build apk --release --target-platform android-arm64 -v
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/palineti-Android-ARM64-${{ github.ref_name }}.apk

      - name: Build AppBundle (Google Play)
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/palineti-Android-ARM64-*.apk

      - name: Upload AppBundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: Build Windows App
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.build_windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Create empty asset directories if missing
        shell: bash
        run: mkdir -p assets/animations assets/audio assets/data assets/branding

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: flutter build windows --release

      - name: Zip Windows build
        shell: powershell
        run: |
          $absolutePath = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release\*"
          Compress-Archive -Path $absolutePath -DestinationPath palineti-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: palineti-Windows-*.zip

  build-ios:
    name: Build iOS IPA (sideload)
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.build_ios
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data assets/branding

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || true

      # === FIX cho lỗi "sandbox is not in sync with Podfile.lock" ===
      # Nguyên nhân cũ:
      # 1. Workflow cũ xóa luôn Podfile (rm -rf Podfile Podfile.lock Pods) khiến flutter phải regenerate Podfile trong lúc build -> Podfile.lock out of sync
      # 2. Platform mặc định thấp hơn 13.0 -> flutter tự động upgrade Podfile giữa chừng -> lại out of sync
      # Fix mới:
      # - Commit sẵn ios/Podfile với platform :ios, '13.0'
      # - Chỉ xóa Pods + Podfile.lock + .symlinks, KHÔNG xóa Podfile
      # - Chạy pod install trước build, và kiểm tra nếu flutter có upgrade Podfile thì pod install lại rồi build lại
      - name: Ensure Podfile exists with correct platform
        run: |
          cat ios/Podfile
          # Đảm bảo platform tối thiểu 13.0 để flutter không tự upgrade giữa build
          if ! grep -q "platform :ios" ios/Podfile; then
            echo "Podfile missing platform, check file"
            exit 1
          fi

      - name: Install CocoaPods dependencies (clean)
        run: |
          cd ios
          # Chỉ xóa artifacts, giữ lại Podfile gốc đã fix lỗi
          rm -rf Pods Podfile.lock .symlinks
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign) - First pass
        run: flutter build ios --release --no-codesign --no-pub

      - name: Re-sync Pods if Podfile was upgraded by Flutter
        run: |
          cd ios
          # Nếu Podfile bị Flutter chỉnh sửa (ví dụ update deployment target), Podfile.lock sẽ lệch
          # So sánh Manifest.lock với Podfile.lock để phát hiện lệch
          if [ -f Pods/Manifest.lock ]; then
            if ! diff -q Podfile.lock Pods/Manifest.lock > /dev/null 2>&1; then
              echo "Detected Podfile.lock out of sync after flutter build, re-installing pods..."
              pod install
            else
              echo "Pods are in sync, no need to reinstall"
            fi
          else
            echo "Manifest.lock not found, running pod install"
            pod install
          fi
          cd ..

      - name: Build iOS (no codesign) - Second pass if needed (idempotent)
        run: |
          # Build lại để đảm bảo Xcode build thành công sau khi re-sync
          # Lần build thứ 2 sẽ rất nhanh nếu không có gì thay đổi
          flutter build ios --release --no-codesign --no-pub || (cd ios && pod install && cd .. && flutter build ios --release --no-codesign --no-pub)

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r palineti-iOS-${{ github.ref_name }}.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: palineti-iOS-*.ipa

  build-linux:
    name: Build Linux App
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data assets/branding

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Zip Linux build
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../palineti-Linux-${{ github.ref_name }}.zip .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: palineti-Linux-*.zip

  build-web:
    name: Build Web App
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data assets/branding

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  create-release:
    name: Create Release
    needs: [build-android, build-windows, build-ios, build-linux, build-web]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-appbundle/*.aab
            artifacts/windows-zip/*.zip
            artifacts/ios-ipa/*.ipa
            artifacts/linux-zip/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
