name: Content audit

# Static checks on the lesson data and the localisation sidecars, plus
# Flutter static analysis and unit/widget tests.
#
# What it enforces:
#   1. Sidecar integrity   - catalog, key sets, quiz shape, Dart syntax.
#   2. Vocabulary coverage - every Pali word an exercise asks the learner to
#                            translate must be traceable to vocabulary taught
#                            in that lesson or an earlier one.  This is the
#                            "did we teach this before we tested it?" question.
#   3. ARB coverage        - no missing/extra keys, no placeholder errors.
#   4. Flutter analyze & test - 0 analyzer errors and all tests green.
#
# The --max-untraced / --max-neverlisted thresholds are ceilings, not targets.
# They sit just above today's measured value so that a regression fails the
# build while ordinary content work (which lowers the numbers) does not.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.ci/**'
  pull_request:
  workflow_dispatch:
    inputs:
      max_untraced:
        description: 'Fail above this many untraceable exercise words'
        type: string
        default: '203'
      max_neverlisted:
        description: 'Fail above this many words that appear in no word list'
        type: string
        default: '162'

permissions:
  contents: write

jobs:
  audit:
    name: Audit lesson data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sweep the sandbox (corpus.json is git-ignored)
        run: python3 tools/_extract_corpus.py

      - name: Sidecar integrity + translation quality report
        run: python3 tools/generate_locale_sidecars.py --verbose-quality

      - name: Vocabulary coverage gate
        run: |
          python3 tools/audit_vocab_coverage.py \
            --max-untraced "${{ inputs.max_untraced || '203' }}" \
            --max-neverlisted "${{ inputs.max_neverlisted || '162' }}"

      - name: ARB coverage (UI strings)
        run: python3 tools/audit_locales.py

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos 2>&1 | tee /tmp/flutter_analyze.txt

      - name: Run flutter test
        id: test
        continue-on-error: true
        env:
          CAPTURE_VOCAB_SCREENSHOTS: '1'
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee /tmp/flutter_test.txt

      - name: Publish check summary
        if: always()
        run: |
          python3 - << 'PY'
          import pathlib

          for name, p in [("flutter_analyze", "/tmp/flutter_analyze.txt"), ("flutter_test", "/tmp/flutter_test.txt")]:
              path = pathlib.Path(p)
              if path.exists():
                  txt = path.read_text(errors="replace")
                  chunk_size = 2500
                  chunks = [txt[i:i+chunk_size] for i in range(0, len(txt), chunk_size)]
                  for idx, ch in enumerate(chunks[-4:], 1):
                      enc = ch.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::notice title={name}_{idx}::{enc}")
          PY
          mkdir -p .ci
          cp -f /tmp/flutter_analyze.txt .ci/flutter_analyze.txt 2>/dev/null || true
          cp -f /tmp/flutter_test.txt .ci/flutter_test.txt 2>/dev/null || true
          cp -f /tmp/vocab_lesson_13.png .ci/vocab_lesson_13.png 2>/dev/null || true
          cp -f /tmp/vocab_lesson_19.png .ci/vocab_lesson_19.png 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/
          git diff --cached --quiet && exit 0
          git commit -m "ci: publish flutter analyze and test diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce pass
        run: |
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
