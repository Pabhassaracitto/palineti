name: Generate learning-content locales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Translate sidecar overlays
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Generate SI, ZH, MY, and HI overlays
        run: python3 tools/generate_locale_sidecars.py --translate

      - name: Commit generated locale content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/localization/ tools/generate_locale_sidecars.py
          git diff --cached --quiet || git commit -m "feat(l10n): complete SI ZH MY HI learning content"
          git push origin HEAD:${{ github.ref_name }}
