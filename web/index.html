<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Palineti — học Pāḷi theo 26 bài ngữ pháp, có từ vựng, bài tập và giải thích song ngữ Việt/Anh.">
  <meta name="theme-color" content="#FFF8E7">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Palineti — Học Pāḷi">
  <meta property="og:description" content="26 bài ngữ pháp Pāḷi, từ vựng, bài tập và giải thích song ngữ Việt/Anh.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Palineti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Palineti — Học Pāḷi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- First-paint splash. Removed automatically as soon as Flutter mounts. -->
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="Palineti" width="96" height="96">
    <div class="splash-title">PALINETI</div>
    <div class="splash-sub">Học Pāḷi · Pāḷi Course</div>
    <div class="splash-bar"><span></span></div>
    <noscript>Trang này cần JavaScript để chạy (Flutter Web).</noscript>
  </div>

  <style>
    html, body { margin: 0; height: 100%; background: #FFF8E7; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: #FFF8E7; color: #3E2723;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #splash img { border-radius: 24px; box-shadow: 0 6px 24px rgba(128, 0, 32, .12); }
    .splash-title { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #3E2723; }
    .splash-sub { font-size: 13px; color: #8D6E63; letter-spacing: 1px; }
    .splash-bar { width: 140px; height: 3px; border-radius: 2px; background: rgba(184, 134, 11, .2); overflow: hidden; margin-top: 8px; }
    .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: #B8860B; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the splash once Flutter has attached its view to the DOM.
    (function () {
      var splash = document.getElementById('splash');
      function done() {
        if (!splash) return;
        splash.remove();
        splash = null;
        observer.disconnect();
      }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) done();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Safety net: never keep the splash on screen for more than 20s.
      setTimeout(done, 20000);
    })();
  </script>
</body>
</html>
